name: Tests

# ──────────────────────────────────────────────────────────────────────
# Runs on every push and pull request. Fast feedback (< 2 min).
# Two parallel jobs: frontend (i18n+unit+build) + python (unit+CLI).
# Integration tests (real Gerber fixtures) run separately in the
# "Integration Tests" workflow (manual + nightly).
# ──────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (i18n + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-vue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: i18n key consistency check
        run: npm run check:i18n

      - name: Vitest component + logic tests
        run: npx vitest run

      - name: Vite production build
        run: npm run build

  python:
    name: Python (unit + CLI)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Unit tests + CLI tests (fast)
        run: |
          pytest tests/python/ -m "not integration" -q --cov=src/stencilforge --cov-report=term --cov-report=xml
